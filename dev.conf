# Project settings, sourced by bin/dev and bootstrap.sh. Edit these first.

# Short name: state lives in ~/.$NAME-dev, Docker projects are $NAME-dev-<slot>.
NAME=acme
# Command bootstrap.sh puts on PATH (~/.local/bin/$CLI). Pick something unique if
# you work on several projects that use this template.
CLI=dev
# GitHub owner the repos in repos.txt are cloned from.
GH_ORG=acme
# Concurrent stacks per machine (parallel worktrees / agents). Ports shift 10 per slot.
MAX_SLOTS=3
# process-compose's own API port for slot 0. Must differ between projects on one machine.
PC_BASE_PORT=18100
# Containers in compose.stores.yaml whose logs show up in `dev logs` / `dev attach`.
CONTAINERS="postgres"
